<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤점심 메뉴</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
  }

  h1 {
    margin-bottom: 30px;
    font-size: 24px;
    color: #333;
  }

  #menuButton {
    width: 114px;  /* 약 3cm */
    height: 114px; /* 약 3cm */
    font-size: 16px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.1s;
  }

  #menuButton:active {
    transform: translateY(3px); /* 높이 3px 눌리는 느낌 */
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  #result {
    margin-top: 20px;
    font-size: 20px;
    color: #555;
  }
</style>
</head>
<body>

<h1>랜덤 점심 메뉴</h1>
<button id="menuButton">점심 추천!</button>
<div id="result"></div>

<script>
  const menus = [
    "김치찌개", "된장찌개", "제육볶음", "치킨", "피자", 
    "햄버거", "샌드위치", "초밥", "라면", "비빔밥", "순두부찌개", "샤브샤브", "스테이크", "파스타", "리조또"
  ];

  const button = document.getElementById('menuButton');
  const result = document.getElementById('result');

  button.addEventListener('click', () => {
    const randomIndex = Math.floor(Math.random() * menus.length);
    result.textContent = menus[randomIndex];
  });
</script>

</body>
</html>
