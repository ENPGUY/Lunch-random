<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>랜덤 점심 메뉴</title>

  <meta property="og:type" content="website">
  <meta property="og:title" content="🍽️ 점심 뭐 먹지?">
  <meta property="og:description" content="오늘의 점심 메뉴를 랜덤으로 추천해드립니다!">
  <meta property="og:url" content="https://enpguy.github.io/Lunch-random/">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7e6, #ffe0b2);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 32px;
      color: #333;
    }

    #menuButton {
      width: 150px;
      height: 80px;

      font-size: 20px;
      font-weight: bold;

      background-color: #ff9800;
      color: white;

      border: none;
      border-radius: 15px;

      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);

      cursor: pointer;
      transition: 0.15s;
    }

    #menuButton:hover {
      transform: scale(1.05);
    }

    #menuButton:active {
      transform: translateY(3px);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    #result {
      margin-top: 30px;

      min-height: 50px;

      font-size: 30px;
      font-weight: bold;

      color: #333;
    }
  </style>
</head>

<body>

  <h1>🍽️ 오늘 점심 뭐 먹지?</h1>

  <button id="menuButton">점심 추천!</button>

  <div id="result">
    버튼을 눌러주세요!
  </div>

  <script>
    const menus = [
      "🍲 김치찌개",
      "🥘 된장찌개",
      "🥩 제육볶음",
      "🍗 치킨",
      "🍕 피자",
      "🍔 햄버거",
      "🥪 샌드위치",
      "🍣 초밥",
      "🍜 라면",
      "🍚 비빔밥",
      "🥘 순두부찌개",
      "🥩 샤브샤브",
      "🥩 스테이크",
      "🍝 파스타",
      "🍛 카레",
      "🍜 짜장면",
      "🍜 짬뽕",
      "🥟 만두",
      "🍖 돈까스",
      "🍜 냉면",
      "🍲 부대찌개",
      "🍚 볶음밥",
      "🍜 칼국수",
      "🍜 쌀국수",
      "🍱 도시락",
      "🍚 리조또",
    ];

    const button = document.getElementById("menuButton");
    const result = document.getElementById("result");

    button.addEventListener("click", function () {

      const randomIndex =
        Math.floor(Math.random() * menus.length);

      result.textContent =
        "오늘의 점심은 " + menus[randomIndex] + "!";
    });
  </script>

</body>
</html>
